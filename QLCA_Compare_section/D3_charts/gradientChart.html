
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Scenario Comparison</title>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
    background: linear-gradient(180deg, #EDEBEB 0%, #F5F5F5 50.48%);
    font-family: "Inter", Helvetica, sans-serif;
    color: #333;
}

svg {
    border: 1px solid #eee;
}

</style>
</head>

<body>

<h1>Total GWP</h1>
<p>in kg CO2-eq*a</p>

<div id="chart"></div>

<script>
// -----------------------------
// DATA
// -----------------------------

const minGWP = 14632;
const maxGWP = 481947;

const datasets = [
    { data: 338087 },
    { data: 273258 },
    { data: 128188 },
    { data: 51653 }
];

// -----------------------------
// LAYOUT
// -----------------------------

const width = 900;
const height = 600;

const absWidth = 324;
const absH = 25;

const barGap = 120;

// -----------------------------
// SVG
// -----------------------------

const svg = d3.select("#chart")
    .append("svg")
    .attr("width", width)
    .attr("height", height);

const g = svg.append("g")
    .attr("transform", "translate(80,60)");

const defs = svg.append("defs");

// -----------------------------
// GRADIENT
// -----------------------------

const gradient = defs.append("linearGradient")
  .attr("id", "absGradient")
  .attr("x1", "0%")
  .attr("x2", "100%")
  .attr("y1", "0%")
  .attr("y2", "0%");

// left
gradient.append("stop")
  .attr("offset", "0%")
  .attr("stop-color", "#C5CCFF");

// // middle
// gradient.append("stop")
//   .attr("offset", "50%")
//   .attr("stop-color", "#FFD070");

// right
gradient.append("stop")
  .attr("offset", "100%")
  .attr("stop-color", "#FF3916");

// -----------------------------
// SCALE
// -----------------------------

const xAbs = d3.scaleLinear()
    .domain([minGWP, maxGWP])
    .range([0, absWidth]);

// -----------------------------
// FUNCTION
// -----------------------------

function drawAbsoluteBar(g, value, y) {

    const avg = (minGWP + maxGWP) / 2;

    // background
    g.append("rect")
        .attr("x", 0)
        .attr("y", y)
        .attr("width", absWidth)
        .attr("height", absH)
        .attr("fill", "url(#absGradient)");

    // marker
    g.append("line")
        .attr("x1", xAbs(value))
        .attr("x2", xAbs(value))
        .attr("y1", y)
        .attr("y2", y + absH)
        .attr("stroke", "#111")
        .attr("stroke-width", 4);

    // title
    const title = g.append("text")
        .attr("x", 0)
        .attr("y", y - 25);
    
    title.append("tspan")
        .style("font-size", "16px")
        .style("font-weight", "700")
        .text(`${Math.round(value).toLocaleString("de-DE")} `);

    title.append("tspan")
        .style("font-size", "16px")
        .style("font-weight", "700")
        .text("Total GWP");


    title.append("tspan")
        .attr("x", 0)
        .attr("dy", "1.6em")
        .style("font-size", "11px")
        .style("font-weight", "400")
        .style("fill", "#666")
        .text("in kg CO₂-eq*a");

    // min / max
    g.append("text")
        .attr("x", 0)
        .attr("y", y + absH + 18)
        .style("font-size", "14px")
        .text("Min");

    g.append("text")
        .attr("x", absWidth)
        .attr("y", y + absH + 18)
        .attr("text-anchor", "end")
        .style("font-size", "14px")
        .text("Max");

    // average marker
    g.append("text")
        .attr("x", xAbs(avg))
        .attr("y", y + absH + 18)
        .style("font-size", "14px")
        .style("font-weight", "600")
        .attr("text-anchor", "middle")
        .text("∅");

    // avg
    g.append("text")
        .attr("x", xAbs(avg))
        .attr("y", y + absH + 18)
        .attr("text-anchor", "middle")
        .style("font-size", "14px")
        .style("font-weight", "600")
        .text("∅");
}

// -----------------------------
// RENDER
// -----------------------------

drawAbsoluteBar(g, datasets[0].data, 0);

drawAbsoluteBar(g, datasets[1].data, 100);

drawAbsoluteBar(g, datasets[2].data, 200);

drawAbsoluteBar(g, datasets[3].data, 300);


</script>

</body>
</html>
